openapi: 3.0.3
info:
  title: Rattle Edge Functions API
  version: "1.0.0"
  description: |
    Rattle은 별도 REST 백엔드 없이 Supabase(PostgREST + RLS)를 클라이언트에서 직접
    호출하는 구조다. 이 문서는 그중 **HTTP로 직접 호출되는 부분**, 즉 Supabase
    Edge Functions(`supabase/functions/*`) 5개만 다룬다.

    테이블 CRUD는 `lib/services/*.ts`가 supabase-js로 직접 호출하며 RLS로
    보호된다 (문서화 대상 아님 — RLS 정책은 `supabase/migrations/*_rls*.sql` 참고).

    ## 인증
    Toss 웹훅을 제외한 모든 함수는 Supabase 표준 방식대로 `Authorization: Bearer
    <user JWT>` 헤더가 필요하다 (`supabase.functions.invoke()`가 로그인 세션의
    토큰을 자동으로 붙인다). `apikey` 헤더(anon key)도 Supabase 게이트웨이
    레벨에서 함께 요구된다.

    `toss-webhook`만 예외로, Toss Place 서버가 호출하므로 JWT 검증은 배포 시
    비활성화(`--no-verify-jwt`)해야 하며 대신 HMAC-SHA256 서명을 직접 검증한다.
    실제 배포 설정은 이 저장소만으로 확인되지 않으므로 배포 시 검증해야 한다.
  contact:
    name: Rattle
servers:
  - url: https://{project-ref}.supabase.co/functions/v1
    description: Supabase Edge Functions
    variables:
      project-ref:
        default: your-project-ref
        description: Supabase 프로젝트 참조 ID (대시보드 URL에서 확인)

tags:
  - name: account
    description: 계정 관리
  - name: purchases
    description: 매입 OCR
  - name: toss-place
    description: Toss Place POS 연동
  - name: webhooks
    description: 외부 시스템이 호출하는 웹훅

security:
  - bearerAuth: []
    apiKeyAuth: []

paths:
  /delete-account:
    post:
      operationId: deleteAccount
      tags: [account]
      summary: 회원 탈퇴
      description: |
        호출한 사용자 본인의 계정을 완전히 삭제한다.

        처리 순서:
        1. 연동된 소셜 로그인(카카오) 연결 해제 — 실패해도 탈퇴는 계속 진행
        2. `delete_user_data()` RPC로 사용자 소유 데이터 삭제
        3. Supabase Auth 계정 삭제 (service role 권한 사용)

        요청 본문은 없다 — `Authorization` 헤더의 JWT로 대상을 특정한다.
      security:
        - bearerAuth: []
          apiKeyAuth: []
      responses:
        "200":
          description: 탈퇴 완료
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    enum: [true]
              example:
                success: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: RPC 실패 또는 Auth 삭제 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ocr:
    post:
      operationId: extractPurchaseItemsFromImage
      tags: [purchases]
      summary: 납품서/영수증 이미지에서 품목 추출 (Gemini Vision)
      description: |
        이미지를 base64로 전달하면 Gemini 3 Flash Preview로 품목명·수량·단위·
        단가를 추출해 반환한다. 클라이언트는 이 결과를 매입 등록 화면에서
        재고와 매칭해 보여준다 (`lib/services/ocr.ts` → `parseOcrItems`).
      security:
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_base64]
              properties:
                image_base64:
                  type: string
                  format: byte
                  description: JPEG 이미지의 base64 인코딩 문자열 (최대 10MB, data URI 접두어 없이 순수 base64)
      responses:
        "200":
          description: 추출된 품목 목록 (인식 실패 시 빈 배열)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OcrLineItem"
              example:
                items:
                  - name: "삼겹살"
                    quantity: 3
                    unit: "kg"
                    unit_price: 18000
        "400":
          description: image_base64 누락
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: 이미지 크기 초과 (10MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Gemini API 호출 실패 또는 서버 설정 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /toss-proxy:
    post:
      operationId: proxyTossPlaceRequest
      tags: [toss-place]
      summary: Toss Place Open API 프록시
      description: |
        Toss Place의 액세스 키/시크릿을 클라이언트에 노출하지 않기 위한 조회 전용
        프록시. 함수 내부에서 사용자 JWT를 검증하고, 가맹점에 연결된 매장의
        소유자 또는 승인된 멤버인지 확인한다. 세 가지 GET 경로만 허용하며
        상대 경로, 인코딩된 경로, 임의 엔드포인트 및 쓰기 요청을 거부한다. `path`로 지정한 Toss Place Open API 엔드포인트를 서버 쪽
        자격증명(`x-access-key`/`x-secret-key`)으로 대신 호출해 응답을
        그대로 돌려준다. 응답 상태 코드도 Toss의 것을 그대로 전달한다.

        실사용 경로 예시 (`lib/services/tossplace.ts`, `posAnalytics.ts`):
        - `GET /merchants/{merchantId}/order/orders?from=&to=` — 기간별 주문
        - `GET /merchants/{merchantId}/order/orders/{orderId}` — 주문 상세
        - `GET /merchants/{merchantId}/catalog/items` — 카탈로그(품목) 목록
      security:
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Toss Place Open API의 path (base URL 제외, 쿼리스트링 포함 가능)
                  example: "/merchants/mch_123/order/orders?from=2026-09-01T00:00:00&to=2026-09-30T23:59:59"
                method:
                  type: string
                  enum: [GET]
                  default: GET
                body:
                  type: object
                  nullable: true
                  description: 사용하지 않음. 생략하거나 null이어야 하며 그 외 값은 400으로 거부
      responses:
        "200":
          description: Toss Place API 응답을 그대로 전달 (스키마는 호출한 path에 따라 다름)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: 잘못된 JSON, 미허용 경로·메서드·쿼리 또는 upstream body 지정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 가맹점에 연결된 매장 접근 권한 없음
        "405":
          description: 외부 HTTP 메서드는 POST와 OPTIONS만 허용
        "500":
          description: Toss 서버 자격증명 미설정
        "502":
          description: 권한 조회 실패, upstream 네트워크·리다이렉트·응답 형식 오류
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  detail:
                    type: string
        default:
          description: Toss Place API가 반환한 그 외 상태 코드가 그대로 전달됨

  /submit-toss-application:
    post:
      operationId: submitTossPlaceApplication
      tags: [toss-place]
      summary: Toss Place 가맹점 연동 신청
      description: |
        매장의 Toss Place 연동을 신청하는 Google Forms를 서버에서 대신
        제출한다 (`lib/services/tossPlaceForm.ts`). 신청 내용은 Toss Place
        운영팀이 검토 후 가맹점 대표자 동의(녹취) 절차를 거쳐 실제
        연동한다.
      security:
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, businessNumber, ownerPhone]
              properties:
                name:
                  type: string
                  description: 매장명
                address:
                  type: string
                  description: 매장 주소
                businessNumber:
                  type: string
                  description: 사업자등록번호
                ownerPhone:
                  type: string
                  description: 대표자 연락처
      responses:
        "200":
          description: 신청 폼 제출 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: 서버 환경변수 미설정(TOSS_CONTACT_EMAIL/PHONE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Google Forms 제출 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /toss-webhook:
    post:
      operationId: receiveTossWebhook
      tags: [webhooks]
      summary: Toss Place 가맹점 설치/해제 웹훅 수신
      description: |
        Toss Place가 앱 설치(`app.installation.created.v1`)/해제
        (`app.installation.deleted.v1`) 이벤트를 서비스코드 연동 방식으로
        보내는 웹훅. **Rattle 앱이 아니라 Toss Place 서버가 호출한다.**

        - HMAC-SHA256(`TOSS_WEBHOOK_SECRET`, `${timestamp}.${rawBody}`)
          서명을 `x-toss-signature`로 검증, 실패 시 401
        - `event.id` 기준으로 멱등 처리 — 이미 처리한 이벤트는
          `duplicated: true`로 2xx 응답해 Toss의 재전송을 끝냄
        - 설치 시 사업자번호(`find_store_by_biznum` RPC)로 매장을 자동
          매칭하고, 못 찾으면 `toss_pending_installations` 큐에 보관
        - 처리 중 예외가 나면 5xx로 응답해 Toss가 재전송하도록 하고,
          멱등 기록은 롤백한다
      security:
        - webhookSignature: []
      parameters:
        - name: x-toss-signature
          in: header
          required: true
          schema:
            type: string
          description: '`v1=<hex HMAC-SHA256>` 형식의 서명'
        - name: x-toss-timestamp
          in: header
          required: true
          schema:
            type: string
          description: 서명 계산에 사용된 타임스탬프 (서명 payload의 일부)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type]
              properties:
                id:
                  type: string
                  description: 이벤트 고유 ID (멱등 키)
                type:
                  type: string
                  enum:
                    - app.installation.created.v1
                    - app.installation.deleted.v1
                merchantId:
                  type: string
                data:
                  type: object
                  properties:
                    merchant:
                      type: object
                      properties:
                        id:
                          type: string
                        businessNumber:
                          type: string
                        name:
                          type: string
                        displayName:
                          type: string
                        ownerName:
                          type: string
                        phoneNumber:
                          type: string
                        address:
                          type: string
            example:
              id: "evt_abc123"
              type: "app.installation.created.v1"
              data:
                merchant:
                  id: "mch_123"
                  businessNumber: "123-45-67890"
                  name: "테네스 행궁"
      responses:
        "200":
          description: 수신 완료 (또는 이미 처리한 이벤트라 스킵)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  duplicated:
                    type: boolean
              examples:
                processed:
                  value: { received: true }
                duplicated:
                  value: { received: true, duplicated: true }
        "400":
          description: JSON 파싱 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 서명 헤더 누락 또는 서명 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 설정 오류 또는 이벤트 처리 실패 (Toss가 재전송함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인한 사용자의 Supabase Auth 세션 access token
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Supabase anon key (게이트웨이 레벨에서 요구됨)
    webhookSignature:
      type: apiKey
      in: header
      name: x-toss-signature
      description: HMAC-SHA256 서명 — 별도 apikey/JWT 불필요 (배포 시 verify_jwt 비활성화 필요, 현재 배포 상태 미확인)

  responses:
    Unauthorized:
      description: Authorization 헤더 누락 또는 유효하지 않은 사용자
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Unauthorized

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OcrLineItem:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: number
        unit:
          type: string
          enum: [개, 병, 캔, 팩, 봉, 박스, kg, g, L, ml, 장, 묶음]
        unit_price:
          type: number
